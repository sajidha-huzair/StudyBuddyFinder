databases:
  - name: studybuddy-db
    databaseName: studybuddy_db
    user: studybuddy
    plan: free

services:
  - type: web
    name: studybuddy-api
    runtime: docker
    rootDir: Server
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: studybuddy-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DAILY_API_KEY
        sync: false
      - key: DAILY_WEBHOOK_SECRET
        sync: false
      - key: JITSI_DOMAIN
        value: meet.jit.si
      # Optional: add a Render Redis instance and set REDIS_URL for multi-instance WebSockets
      - key: REDIS_URL
        sync: false
